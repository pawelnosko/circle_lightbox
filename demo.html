<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Lightbox — demo</title>
  <link rel="stylesheet" href="jquery.circle-lightbox.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f0f12;
      color: #e8e8ec;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { font-weight: 600; margin-bottom: 0.5rem; }
    p { opacity: 0.75; margin-top: 0; max-width: 42rem; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
      max-width: 1100px;
    }
    .gallery a {
      display: block;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #222;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery a:hover img { transform: scale(1.05); }
  </style>
</head>
<body>
  <h1>Circle Lightbox</h1>
  <p>
    Kliknij miniaturę — koło backdropu rośnie z centrum (przekrywa cały ekran),
    potem płynnie staje się prostokątem 100%×100%, na końcu wskakuje zdjęcie.
  </p>

  <div class="gallery" id="demo-gallery">
    <a href="sample/dc_carouse.webp" data-clb-gallery="demo">
      <img src="sample/dc_carouse.webp" alt="Karuzela DC" />
    </a>
    <a href="sample/dc_pcategories.webp" data-clb-gallery="demo">
      <img src="sample/dc_pcategories.webp" alt="Kategorie produktów" />
    </a>
    <a href="sample/dc_pfeaturedbox.png" data-clb-gallery="demo">
      <img src="sample/dc_pfeaturedbox.png" alt="Featured box" />
    </a>
    <a href="sample/dc-simple-slider.png" data-clb-gallery="demo">
      <img src="sample/dc-simple-slider.png" alt="Prosty slider" />
    </a>
    <a href="sample/jaki-serwer-wybrac-pod-sklep-internetowy.png" data-clb-gallery="demo">
      <img src="sample/jaki-serwer-wybrac-pod-sklep-internetowy.png" alt="Jaki serwer pod sklep" />
    </a>
    <a href="sample/od-czego-zaczac-sprzedaz-w-internecie.png" data-clb-gallery="demo">
      <img src="sample/od-czego-zaczac-sprzedaz-w-internecie.png" alt="Od czego zacząć sprzedaż" />
    </a>
    <a href="sample/sklep-zgodny-z-prawem.png" data-clb-gallery="demo">
      <img src="sample/sklep-zgodny-z-prawem.png" alt="Sklep zgodny z prawem" />
    </a>
    <a href="sample/wp-dc-gmap.png" data-clb-gallery="demo">
      <img src="sample/wp-dc-gmap.png" alt="DC Google Map" />
    </a>
    <a href="sample/zuki.png" data-clb-gallery="demo">
      <img src="sample/zuki.png" alt="Żuki" />
    </a>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="jquery.circle-lightbox.js"></script>
  <script>
    $('#demo-gallery').circleLightbox({
      colors: ['#322658', '#7664b3'],
      morphToRect: true,
      openDuration: 650
    });
  </script>
</body>
</html>
